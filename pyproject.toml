[project]
name = "coding-synchronization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "py-spy>=0.4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade — modernise syntax
    "B",    # flake8-bugbear — common bugs and design issues
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8 naming conventions
    "PIE",  # misc improvements
]
ignore = [
    "B008",   # function calls in default args — intentional in StageABC queue defaults
    "SIM108", # ternary operator — prefer explicit if/else in pipeline code
    "N999",   # PascalCase module names — established convention in this project
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
reportArgumentType = "none"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_synchronization"]
